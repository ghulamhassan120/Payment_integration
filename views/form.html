
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stripe Payment</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 min-height:100vh;display:grid;place-items:center;
 background:linear-gradient(135deg,#0f172a,#1e1b4b);
 font-family:Arial,sans-serif;color:white;padding:20px;
}
.card{
 width:100%;max-width:420px;padding:35px;
 background:#ffffff0d;border:1px solid #ffffff20;
 border-radius:24px;backdrop-filter:blur(20px);
 box-shadow:0 25px 70px #0006;
}
.tag{color:#a5b4fc;font-size:12px;letter-spacing:3px}
h1{font-size:28px;margin:15px 0 8px}
p{color:#94a3b8;font-size:14px;margin-bottom:30px}
label{display:block;font-size:13px;margin-bottom:12px;color:#cbd5e1}
.amount{
 display:flex;align-items:center;gap:12px;
 background:#ffffff0b;border:1px solid #475569;
 border-radius:14px;padding:5px 18px;margin-bottom:22px;
}
.amount span{font-size:25px;color:#a5b4fc}
input{
 width:100%;background:transparent;border:0;
 outline:0;color:white;font-size:27px;
 padding:13px 0;min-width:0;
}
button{
 width:100%;padding:16px;border:0;border-radius:13px;
 background:linear-gradient(100deg,#6366f1,#8b5cf6);
 color:white;font-size:16px;font-weight:bold;
 cursor:pointer;transition:.2s;
}
button:hover{transform:translateY(-2px);filter:brightness(1.15)}
button:disabled{opacity:.6;cursor:wait}
.footer{text-align:center;margin-top:22px;font-size:11px;color:#64748b}
</style>
</head>
<body>

<div class="card">
 <div class="tag">STRIPE / PAYMENT</div>
 <h1>Enter Amount</h1>
 <p>Enter your payment amount to continue.</p>

 <form id="paymentForm" action="/api/payment/submit" method="post">
  <label>Payment Amount (USD)</label>
  <div class="amount">
   <span>$</span>
   <input type="number" id="amount" name="amount"
    placeholder="0.00" required>
  </div>
  <button type="submit" id="payBtn">Pay Now →</button>
 </form>

 <div class="footer">🔒 Secure payment powered by Stripe</div>
</div>


</body>
</html>
